<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网申资料助手</title><link rel="stylesheet" href="panel.css"></head>
<body><header><img src="icon.png" width="32" height="32" alt=""><div><h1>网申资料助手</h1><p>与应聘记录同步</p></div><button id="add" title="新增资料" aria-label="新增资料">＋</button></header>
<main><p id="status" role="status">尚未启用网页填写</p><div id="context"></div><nav aria-label="资料视图"><button data-view="all" aria-pressed="true">全部</button><button data-view="dates" aria-pressed="false">日期</button><button data-view="pending" aria-pressed="false">待确认</button></nav><input id="search" type="search" placeholder="搜索资料" aria-label="搜索资料"><div id="entries"></div></main>
<footer><button id="export">导出资料</button><label class="import">导入资料<input id="import" type="file" accept=".json,application/json"></label><button id="clear">清空</button></footer>
<dialog id="editor"><form id="edit-form"><h2>编辑资料</h2><label>分组<select name="group" required></select></label><label id="new-group-row" hidden>新分组名称<input name="newGroup" maxlength="100" disabled></label><label>字段名称<input name="label" required></label><label>内容<textarea name="value" rows="6"></textarea></label><label>识别别名（逗号分隔）<input name="aliases"></label><label>来源 / 备注<textarea name="source" rows="3"></textarea></label><label class="check"><input name="date" type="checkbox">日期，仅作提示</label><label class="check"><input name="pending" type="checkbox">待确认，暂不推荐</label><div class="actions"><button type="button" id="delete">删除</button><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<script src="engine.js"></script><script src="panel.js"></script></body></html>
